<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- PR Tracker: a pull-request branch with a review check -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- base branch -->
    <circle cx="34" cy="32" r="9"/>
    <line x1="34" y1="41" x2="34" y2="75"/>
    <circle cx="34" cy="84" r="9"/>
    <!-- head branch arcing into it -->
    <path d="M78 59 V46 a13 13 0 0 0 -13 -13 H54"/>
    <path d="M62 25 L54 33 L62 41"/>
    <circle cx="78" cy="68" r="9"/>
  </g>
  <!-- review check badge -->
  <circle cx="99" cy="99" r="22" fill="#22c55e" stroke="#fff" stroke-width="5"/>
  <path d="M89 99 l7 7 l13 -14" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
