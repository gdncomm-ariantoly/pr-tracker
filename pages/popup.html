<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PR Tracker</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="../icons/icon-32.png" alt="" width="18" height="18" />
      <strong>PR Tracker</strong>
      <span class="muted" id="fetched"></span>
      <span class="spacer"></span>
      <button type="button" id="refresh" title="Fetch from GitHub now" aria-label="Refresh">↻</button>
      <button type="button" class="primary" id="open-full">Open full page</button>
    </header>

    <p class="banner error" id="error" role="alert" hidden></p>

    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-toReview" data-tab="toReview" aria-selected="true">To review <span class="n" id="n-toReview">0</span></button>
      <button type="button" role="tab" id="tab-mine" data-tab="mine" aria-selected="false">My PRs <span class="n" id="n-mine">0</span></button>
    </nav>

    <ul class="list" id="list" aria-live="polite"></ul>
    <p class="muted empty" id="empty" hidden></p>
    <p class="muted more" id="more" hidden></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
